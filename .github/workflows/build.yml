name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: gradle/actions/setup-gradle@v4
      - name: Bouwen
        run: chmod +x gradlew && ./gradlew build --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: binnenvaart-jar
          path: build/libs/*.jar
      - name: Servertest
        run: |
          mkdir -p run && echo "eula=true" > run/eula.txt
          cat > run/server.properties <<'PROPS'
          online-mode=false
          spawn-protection=0
          level-type=minecraft\:flat
          generator-settings={"layers"\:[{"block"\:"minecraft\:bedrock","height"\:1},{"block"\:"minecraft\:stone","height"\:3},{"block"\:"minecraft\:sand","height"\:1},{"block"\:"minecraft\:water","height"\:8}],"biome"\:"minecraft\:river"}
          generate-structures=false
          spawn-monsters=false
          spawn-animals=false
          view-distance=10
          simulation-distance=10
          PROPS
          sed -i 's/^ *//' run/server.properties
          timeout 900 ./gradlew runTestServer --stacktrace || true
          cat run/selftest.txt || echo "geen selftest.txt"
      - name: Clienttest
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q xvfb libgl1-mesa-dri mesa-utils > /dev/null
          rm -rf run/saves && mkdir -p run/saves && cp -r run/world run/saves/testwelt || true
          printf 'onboardAccessibility:false\nrenderDistance:10\nsimulationDistance:10\npauseOnLostFocus:false\nnarrator:0\nguiScale:2\nskipMultiplayerWarning:true\njoinedFirstServer:true\ntutorialStep:none\nsoundCategory_master:0.0\nfov:0.15\n' > run/options.txt
          export LIBGL_ALWAYS_SOFTWARE=1
          timeout 1500 xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew runTestClient --stacktrace || true
          cat run/client_selftest.txt || echo "geen client_selftest.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: testresultaten
          path: |
            run/screenshots/
            run/logs/latest.log
            run/selftest.txt
            run/client_selftest.txt
      - name: Uitslag
        run: grep -q "RESULT PASS" run/selftest.txt && grep -q "RESULT PASS" run/client_selftest.txt

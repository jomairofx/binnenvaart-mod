name: build
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: gradle/actions/setup-gradle@v4
      - name: Bouwen
        continue-on-error: true
        run: chmod +x gradlew && set -o pipefail && ./gradlew build --stacktrace 2>&1 | tee build_out.txt
      - uses: actions/upload-artifact@v4
        with:
          name: binnenvaart-jar
          path: build/libs/*.jar
      - name: Servertest
        run: |
          mkdir -p run && echo "eula=true" > run/eula.txt
          cat > run/server.properties <<'PROPS'
          online-mode=false
          spawn-protection=0
          level-type=minecraft\:flat
          generator-settings={"layers"\:[{"block"\:"minecraft\:bedrock","height"\:1},{"block"\:"minecraft\:stone","height"\:3},{"block"\:"minecraft\:sand","height"\:1},{"block"\:"minecraft\:water","height"\:8}],"biome"\:"minecraft\:river"}
          generate-structures=false
          spawn-monsters=false
          spawn-animals=false
          view-distance=10
          simulation-distance=10
          PROPS
          sed -i 's/^ *//' run/server.properties
          timeout 900 ./gradlew runTestServer --stacktrace > server_out.txt 2>&1 || true
          cp run/logs/latest.log run/server.log || true
          cat run/selftest.txt || echo "geen selftest.txt"
      - name: Clienttest
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q xvfb libgl1-mesa-dri mesa-utils > /dev/null
          rm -rf run/saves && mkdir -p run/saves && cp -r run/world run/saves/testwelt || true
          printf 'onboardAccessibility:false\nrenderDistance:10\nsimulationDistance:10\npauseOnLostFocus:false\nnarrator:0\nguiScale:2\nskipMultiplayerWarning:true\njoinedFirstServer:true\ntutorialStep:none\nsoundCategory_master:1.0\nfov:0.15\n' > run/options.txt
          export LIBGL_ALWAYS_SOFTWARE=1
          export ALSOFT_DRIVERS=null
          timeout 1500 xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew runTestClient --stacktrace > client_out.txt 2>&1 || true
          cp run/logs/latest.log run/client.log || true
          cat run/client_selftest.txt || echo "geen client_selftest.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: testresultaten
          path: |
            run/screenshots/
            run/logs/latest.log
            run/selftest.txt
            run/client_selftest.txt
      - name: Inland Barge bouwen
        continue-on-error: true
        working-directory: inland-barge
        run: chmod +x gradlew && set -o pipefail && ./gradlew build --stacktrace 2>&1 | tee build_out.txt
      - name: Inland Barge servertest (met Binnenvaart samen)
        working-directory: inland-barge
        run: |
          mkdir -p run/mods && cp ../build/libs/binnenvaart-1.0.0.jar run/mods/ && echo "eula=true" > run/eula.txt
          cp ../run/server.properties run/server.properties
          timeout 900 ./gradlew runTestServer --stacktrace > server_out.txt 2>&1 || true
          cp run/logs/latest.log run/server.log || true
          cat run/selftest.txt || echo "geen selftest.txt"
      - name: Inland Barge clienttest
        working-directory: inland-barge
        run: |
          rm -rf run/saves && mkdir -p run/saves && cp -r run/world run/saves/testwelt || true
          cp ../run/options.txt run/options.txt
          export LIBGL_ALWAYS_SOFTWARE=1
          export ALSOFT_DRIVERS=null
          timeout 1500 xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew runTestClient --stacktrace > client_out.txt 2>&1 || true
          cp run/logs/latest.log run/client.log || true
          cat run/client_selftest.txt || echo "geen client_selftest.txt"
      - name: Kempenaar bouwen
        continue-on-error: true
        working-directory: kempenaar
        run: chmod +x gradlew && set -o pipefail && ./gradlew build --stacktrace 2>&1 | tee build_out.txt
      - name: Kempenaar servertest (met de andere mods)
        working-directory: kempenaar
        run: |
          mkdir -p run/mods && cp ../build/libs/binnenvaart-1.0.0.jar ../inland-barge/build/libs/inland-barge-1.0.0.jar run/mods/ && echo "eula=true" > run/eula.txt
          cp ../run/server.properties run/server.properties
          timeout 900 ./gradlew runTestServer --stacktrace > server_out.txt 2>&1 || true
          cp run/logs/latest.log run/server.log || true
          cat run/selftest.txt || echo "geen selftest.txt"
      - name: Kempenaar clienttest
        working-directory: kempenaar
        run: |
          rm -rf run/saves && mkdir -p run/saves && cp -r run/world run/saves/testwelt || true
          cp ../run/options.txt run/options.txt
          export LIBGL_ALWAYS_SOFTWARE=1
          export ALSOFT_DRIVERS=null
          timeout 1500 xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew runTestClient --stacktrace > client_out.txt 2>&1 || true
          cp run/logs/latest.log run/client.log || true
          cat run/client_selftest.txt || echo "geen client_selftest.txt"
      - name: Modern Bulk Carrier bouwen
        continue-on-error: true
        working-directory: modern-bulk
        run: chmod +x gradlew && set -o pipefail && ./gradlew build --stacktrace 2>&1 | tee build_out.txt
      - name: Modern Bulk Carrier servertest (met Binnenvaart samen)
        working-directory: modern-bulk
        run: |
          mkdir -p run/mods && cp ../build/libs/binnenvaart-1.0.0.jar run/mods/ && echo "eula=true" > run/eula.txt
          cp ../run/server.properties run/server.properties
          timeout 900 ./gradlew runTestServer --stacktrace > server_out.txt 2>&1 || true
          cp run/logs/latest.log run/server.log || true
          cat run/selftest.txt || echo "geen selftest.txt"
      - name: Modern Bulk Carrier clienttest
        working-directory: modern-bulk
        run: |
          rm -rf run/saves && mkdir -p run/saves && cp -r run/world run/saves/testwelt || true
          cp ../run/options.txt run/options.txt
          export LIBGL_ALWAYS_SOFTWARE=1
          export ALSOFT_DRIVERS=null
          timeout 1500 xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew runTestClient --stacktrace > client_out.txt 2>&1 || true
          cp run/logs/latest.log run/client.log || true
          cat run/client_selftest.txt || echo "geen client_selftest.txt"
      - name: No Kelp bouwen
        continue-on-error: true
        working-directory: no-kelp
        run: chmod +x gradlew && set -o pipefail && ./gradlew build --stacktrace 2>&1 | tee build_out.txt
      - name: No Kelp servertest (met de scheepsmods)
        working-directory: no-kelp
        run: |
          mkdir -p run/mods && cp ../build/libs/binnenvaart-1.0.0.jar ../inland-barge/build/libs/inland-barge-1.0.0.jar ../kempenaar/build/libs/kempenaar-1.0.0.jar run/mods/ || true
          echo "eula=true" > run/eula.txt
          cp ../run/server.properties run/server.properties
          timeout 600 ./gradlew runTestServer --stacktrace > server_out.txt 2>&1 || true
          cp run/logs/latest.log run/server.log || true
          cat run/selftest.txt || echo "geen selftest.txt"
      - name: Resultaten naar branch
        if: always()
        run: |
          mkdir -p /tmp/out
          cp -r run/screenshots /tmp/out/ 2>/dev/null || true
          cp run/*.txt run/*.log server_out.txt client_out.txt build_out.txt /tmp/out/ 2>/dev/null || true
          cp build/libs/binnenvaart-1.0.0.jar /tmp/out/ 2>/dev/null || true
          mkdir -p /tmp/out/barge
          cp -r inland-barge/run/screenshots /tmp/out/barge/ 2>/dev/null || true
          cp inland-barge/run/*.txt inland-barge/run/*.log inland-barge/server_out.txt inland-barge/client_out.txt inland-barge/build_out.txt /tmp/out/barge/ 2>/dev/null || true
          cp inland-barge/build/libs/inland-barge-1.0.0.jar /tmp/out/ 2>/dev/null || true
          mkdir -p /tmp/out/kempenaar
          cp -r kempenaar/run/screenshots /tmp/out/kempenaar/ 2>/dev/null || true
          cp kempenaar/run/*.txt kempenaar/run/*.log kempenaar/server_out.txt kempenaar/client_out.txt kempenaar/build_out.txt /tmp/out/kempenaar/ 2>/dev/null || true
          cp kempenaar/build/libs/kempenaar-1.0.0.jar /tmp/out/ 2>/dev/null || true
          mkdir -p /tmp/out/bulk
          cp -r modern-bulk/run/screenshots /tmp/out/bulk/ 2>/dev/null || true
          cp modern-bulk/run/*.txt modern-bulk/run/*.log modern-bulk/server_out.txt modern-bulk/client_out.txt modern-bulk/build_out.txt /tmp/out/bulk/ 2>/dev/null || true
          cp modern-bulk/build/libs/modern-bulk-1.0.0.jar /tmp/out/ 2>/dev/null || true
          mkdir -p /tmp/out/nokelp
          cp no-kelp/run/*.txt no-kelp/run/*.log no-kelp/server_out.txt no-kelp/build_out.txt /tmp/out/nokelp/ 2>/dev/null || true
          cp no-kelp/build/libs/no-kelp-1.0.0.jar /tmp/out/ 2>/dev/null || true
          curl -fsSL -o /tmp/out/fabric-api-0.116.4+1.21.1.jar "https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/0.116.4%2B1.21.1/fabric-api-0.116.4%2B1.21.1.jar" || true
          cd /tmp/out && git init -q && git checkout -q -b ci-resultaten && git add -A
          git -c user.name=ci -c user.email=ci@localhost commit -qm "Resultaten ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" ci-resultaten
      - name: Uitslag
        run: |
          grep -q "RESULT PASS" run/selftest.txt && grep -q "RESULT PASS" run/client_selftest.txt
          grep -q "RESULT PASS" inland-barge/run/selftest.txt && grep -q "RESULT PASS" inland-barge/run/client_selftest.txt
          grep -q "RESULT PASS" kempenaar/run/selftest.txt && grep -q "RESULT PASS" kempenaar/run/client_selftest.txt
          grep -q "RESULT PASS" no-kelp/run/selftest.txt
          grep -q "RESULT PASS" modern-bulk/run/selftest.txt && grep -q "RESULT PASS" modern-bulk/run/client_selftest.txt
          # caught errors in ship code count as failures too
          ! grep -l "Ship error in" run/*.log inland-barge/run/*.log kempenaar/run/*.log modern-bulk/run/*.log 2>/dev/null
          # every block in the ship templates must exist
          ! grep -h "Onbekend blok" run/logs/latest.log inland-barge/run/logs/latest.log kempenaar/run/logs/latest.log modern-bulk/run/logs/latest.log run/*.log inland-barge/run/*.log kempenaar/run/*.log modern-bulk/run/*.log 2>/dev/null | grep -v megatanker
